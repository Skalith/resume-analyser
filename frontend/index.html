<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Job Matcher — React Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 2rem; line-height: 1.5;
    }
    .container { max-width: 960px; margin: 0 auto; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;
    }
    .header-title-group { display: flex; align-items: center; gap: 0.75rem; }
    h1 { font-size: 1.5rem; color: var(--accent); }
    .react-pill {
      font-size: 0.75rem; font-weight: 700; color: #61dafb;
      background: rgba(97, 218, 251, 0.12); border: 1px solid rgba(97, 218, 251, 0.3);
      padding: 0.15rem 0.5rem; border-radius: 999px;
    }
    .muted { color: var(--muted); }
    button {
      background: var(--accent); color: var(--bg); border: none;
      padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer;
      font-size: 0.9rem; transition: background 0.15s ease;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: wait; }
    button.secondary {
      background: var(--border); color: var(--text);
    }
    button.secondary:hover:not(:disabled) { background: #475569; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem;
    }
    .card h2 {
      font-size: 0.85rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 0.75rem;
    }
    .skills { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .skill {
      background: #0f172a; border: 1px solid var(--border); color: var(--accent);
      padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.85rem;
    }
    .dropzone {
      border: 2px dashed var(--border); border-radius: 12px; padding: 2rem;
      text-align: center; transition: border-color 0.2s, background 0.2s; cursor: pointer;
    }
    .dropzone.drag { border-color: var(--accent); background: rgba(56,189,248,0.08); }
    .cz-text { color: var(--muted); }
    .cz-text strong { color: var(--accent); }
    .cz-file { color: var(--text); margin-top: 0.5rem; font-size: 0.9rem; font-weight: 500; }
    .btn-row { margin-top: 1rem; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .filters {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      margin-bottom: 1rem; align-items: flex-end;
    }
    input[type="text"], input[type="password"], select {
      background: #0f172a; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.9rem;
    }
    input[type="text"] { flex: 1; min-width: 180px; }
    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
    .job {
      border: 1px solid var(--border); border-radius: 10px; padding: 1rem;
      margin-bottom: 0.75rem; transition: border-color 0.15s ease;
    }
    .job:hover { border-color: #475569; }
    .job-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; cursor: pointer; }
    .job-title { font-weight: 600; font-size: 1.05rem; }
    .job-company { color: var(--muted); font-size: 0.9rem; }
    .job-location { color: var(--muted); font-size: 0.8rem; font-style: italic; }
    .score { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
    .score.high { color: var(--green); }
    .score.mid { color: var(--yellow); }
    .score.low { color: var(--red); }
    .job-tags { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
    .tag {
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
      padding: 0.15rem 0.5rem; border-radius: 6px; font-size: 0.8rem;
    }
    .tag.matched {
      color: #7dd3fc; border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.08);
    }
    .tag.missing {
      background: rgba(248,113,113,0.1); color: var(--red);
      border-color: var(--red); text-decoration: line-through;
    }
    .gap-label { font-size: 0.75rem; color: var(--muted); margin-left: 0.25rem; font-weight: 600; }
    .job-detail {
      margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border);
      animation: fadeIn 0.2s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .job-detail p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }
    .ai-summary-box {
      background: rgba(56, 189, 248, 0.06); border-left: 3px solid var(--accent);
      padding: 0.6rem 0.9rem; border-radius: 0 8px 8px 0; margin-bottom: 0.75rem;
    }
    .ai-summary-box strong { color: var(--accent); }
    .apply {
      display: inline-block; margin-top: 0.75rem; color: var(--accent);
      text-decoration: none; font-size: 0.9rem; font-weight: 600;
    }
    .apply:hover { text-decoration: underline; }
    .empty { color: var(--muted); font-style: italic; }
    .status-ok { color: var(--green); }
    .status-err { color: var(--red); }
    .status-running { color: var(--yellow); }
    .hidden { display: none; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center; z-index: 100;
      backdrop-filter: blur(2px);
    }
    .modal-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem; max-width: 440px; width: 90%;
    }
    .modal-card h2 { color: var(--accent); margin-bottom: 0.5rem; text-transform: none; font-size: 1.25rem; }
    .modal-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .modal-card input { width: 100%; margin-bottom: 1rem; }

    /* Pipeline status badge */
    .pipeline-badge {
      display: inline-block; font-size: 0.8rem; padding: 0.2rem 0.6rem;
      border-radius: 12px; background: var(--border); color: var(--muted);
      font-weight: 500;
    }
    .pipeline-badge.running { background: rgba(250,204,21,0.2); color: var(--yellow); }

    /* Application tracking buttons */
    .track-row {
      display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap;
    }
    .btn-save {
      background: rgba(74,222,128,0.12); color: var(--green);
      border: 1px solid var(--green); border-radius: 6px;
      padding: 0.35rem 0.8rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .btn-save:hover { background: rgba(74,222,128,0.25); }
    .btn-save.active { background: var(--green); color: var(--bg); }
    .btn-dismiss {
      background: rgba(248,113,113,0.12); color: var(--red);
      border: 1px solid var(--red); border-radius: 6px;
      padding: 0.35rem 0.8rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .btn-dismiss:hover { background: rgba(248,113,113,0.25); }
    .btn-dismiss.active { background: var(--red); color: var(--bg); }

    /* Threshold slider */
    .threshold-row {
      display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .threshold-row label { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    .slider {
      -webkit-appearance: none; appearance: none;
      width: 200px; height: 4px; border-radius: 4px;
      background: var(--border); outline: none; cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
    }
    .slider::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: none;
    }
    .slider-val {
      font-size: 0.9rem; font-weight: 700; color: var(--accent);
      min-width: 3.5rem; text-align: right;
    }
    .results-count {
      font-size: 0.8rem; color: var(--muted); margin-left: auto;
    }
  </style>

  <!-- React 18 & ReactDOM & Babel Standalone (loads local vendor copies with CDN fallback) -->
  <script src="/static/vendor/react.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js'"></script>
  <script src="/static/vendor/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'"></script>
  <script src="/static/vendor/babel.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@babel/standalone/babel.min.js'"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    const KEY_STORE = "rjm_api_key";

    // -------------------------------------------------------------------------
    // API client helper
    // -------------------------------------------------------------------------
    async function apiFetch(path, apiKey, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (apiKey) {
        headers["X-API-Key"] = apiKey;
      }
      return fetch(path, { ...options, headers });
    }

    // -------------------------------------------------------------------------
    // ApiKeyModal Component
    // -------------------------------------------------------------------------
    function ApiKeyModal({ isOpen, initialKey, onSave, onClose }) {
      const [key, setKey] = useState(initialKey || "");

      useEffect(() => {
        setKey(initialKey || "");
      }, [initialKey, isOpen]);

      if (!isOpen) return null;

      return (
        <div className="modal-overlay">
          <div className="modal-card">
            <h2>API Key Settings</h2>
            <p>
              Enter the API key configured in your backend <code>.env</code> file
              (the <code>API_KEY</code> variable). Leave blank if dev mode / no key is required.
            </p>
            <input
              type="password"
              value={key}
              placeholder="your-api-key"
              autoComplete="off"
              onChange={(e) => setKey(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter") onSave(key.trim());
              }}
            />
            <div style={{ display: "flex", gap: "0.5rem" }}>
              <button style={{ flex: 1 }} onClick={() => onSave(key.trim())}>
                Save &amp; Continue
              </button>
              {initialKey !== undefined && (
                <button className="secondary" onClick={onClose}>
                  Cancel
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // Header Component
    // -------------------------------------------------------------------------
    function Header({ pipelineRunning, statusText, statusType, onOpenKeyModal }) {
      return (
        <header>
          <div className="header-title-group">
            <h1>Resume Job Matcher</h1>
            <span className="react-pill">React 18</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "1rem", flexWrap: "wrap" }}>
            <span className={`pipeline-badge ${pipelineRunning ? "running" : ""}`}>
              {pipelineRunning ? "⏳ running" : "idle"}
            </span>
            {statusText && (
              <span className={statusType ? `status-${statusType}` : "muted"} style={{ fontSize: "0.9rem" }}>
                {statusText}
              </span>
            )}
            <button
              className="secondary"
              onClick={onOpenKeyModal}
              style={{ fontSize: "0.8rem", padding: "0.3rem 0.75rem" }}
            >
              API Key
            </button>
          </div>
        </header>
      );
    }

    // -------------------------------------------------------------------------
    // UploadSection Component
    // -------------------------------------------------------------------------
    function UploadSection({ onUpload, onRunCurrent, isUploading, isPipelineRunning }) {
      const [isDragging, setIsDragging] = useState(false);
      const [selectedFile, setSelectedFile] = useState(null);
      const fileInputRef = useRef(null);

      const handleFileSelected = (file) => {
        if (!file) return;
        if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
          alert("Please select a valid PDF file");
          return;
        }
        setSelectedFile(file);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFileSelected(e.dataTransfer.files[0]);
        }
      };

      const handleUploadClick = () => {
        if (!selectedFile) return;
        onUpload(selectedFile);
      };

      return (
        <div className="card">
          <h2>Upload Resume</h2>
          <div
            className={`dropzone ${isDragging ? "drag" : ""}`}
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            onDragOver={(e) => {
              e.preventDefault();
              setIsDragging(true);
            }}
            onDragLeave={() => setIsDragging(false)}
            onDrop={handleDrop}
          >
            <p className="cz-text">
              <strong>Drop your PDF resume here</strong> or click to browse
            </p>
            {selectedFile && (
              <p className="cz-file">
                Selected: {selectedFile.name} ({(selectedFile.size / 1024).toFixed(1)} KB)
              </p>
            )}
          </div>
          <input
            type="file"
            ref={fileInputRef}
            accept=".pdf,application/pdf"
            className="hidden"
            onChange={(e) => {
              if (e.target.files && e.target.files[0]) {
                handleFileSelected(e.target.files[0]);
              }
            }}
          />
          <div className="btn-row">
            <button
              onClick={handleUploadClick}
              disabled={!selectedFile || isUploading || isPipelineRunning}
            >
              {isUploading ? "Uploading…" : "Upload & Match"}
            </button>
            <button
              className="secondary"
              onClick={onRunCurrent}
              disabled={isPipelineRunning}
            >
              Re-run with current resume
            </button>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // CandidateProfile Component
    // -------------------------------------------------------------------------
    function CandidateProfile({ profile }) {
      if (!profile || !profile.skills || profile.skills.length === 0) {
        return (
          <div className="card">
            <h2>Candidate Profile</h2>
            <p className="empty">Run the pipeline to extract your profile and skills.</p>
          </div>
        );
      }

      return (
        <div className="card">
          <h2>Candidate Profile</h2>
          <p className="muted">
            Experience: <strong>{profile.experience_years} years</strong>
            {profile.recorded_at && (
              <span style={{ marginLeft: "1rem", fontSize: "0.8rem" }}>
                Last snapshot: {new Date(profile.recorded_at).toLocaleString()}
              </span>
            )}
          </p>
          <div className="skills" style={{ marginTop: "0.75rem" }}>
            {profile.skills.map((skill) => (
              <span key={skill} className="skill">
                {skill}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // JobCard Component
    // -------------------------------------------------------------------------
    function JobCard({ job, isExpanded, onToggleExpand, onUpdateStatus }) {
      const score = job.match_score || 0;
      let scoreClass = "low";
      if (score >= 60) scoreClass = "high";
      else if (score >= 35) scoreClass = "mid";

      const matchedSkills = job.matched_skills || [];
      const missingSkills = (job.missing_skills || []).slice(0, 8);
      const isSaved = job.saved_status === "saved";
      const isDismissed = job.saved_status === "dismissed";
      const applyUrl = /^https?:\/\//i.test(job.url || "") ? job.url : "";

      return (
        <div className="job">
          <div className="job-head" onClick={onToggleExpand}>
            <div>
              <div className="job-title">{job.title || "Unknown role"}</div>
              <div className="job-company">{job.company || "Unknown company"}</div>
              {job.location && <div className="job-location">📍 {job.location}</div>}
            </div>
            <div className={`score ${scoreClass}`}>{score.toFixed(1)}%</div>
          </div>

          <div className="job-tags">
            {matchedSkills.map((s) => (
              <span key={s} className="tag matched">
                ✓ {s}
              </span>
            ))}
            {missingSkills.length > 0 && (
              <>
                <span className="gap-label">gap:</span>
                {missingSkills.map((s) => (
                  <span key={s} className="tag missing">
                    ✗ {s}
                  </span>
                ))}
              </>
            )}
          </div>

          {isExpanded && (
            <div className="job-detail">
              {job.ai_summary && (
                <div className="ai-summary-box">
                  <strong>AI Fit Summary:</strong> {job.ai_summary}
                </div>
              )}
              {job.description && (
                <p>
                  {job.description.slice(0, 650)}
                  {job.description.length > 650 ? "…" : ""}
                </p>
              )}
              {applyUrl && (
                <div>
                  <a className="apply" href={applyUrl} target="_blank" rel="noopener noreferrer">
                    Apply Now →
                  </a>
                </div>
              )}
              <div className="track-row">
                <button
                  className={`btn-save ${isSaved ? "active" : ""}`}
                  onClick={(e) => {
                    e.stopPropagation();
                    onUpdateStatus(job.id, isSaved ? null : "saved");
                  }}
                >
                  💾 {isSaved ? "Saved" : "Save"}
                </button>
                <button
                  className={`btn-dismiss ${isDismissed ? "active" : ""}`}
                  onClick={(e) => {
                    e.stopPropagation();
                    onUpdateStatus(job.id, isDismissed ? null : "dismissed");
                  }}
                >
                  ✕ {isDismissed ? "Dismissed" : "Dismiss"}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------------------
    // Main App Component
    // -------------------------------------------------------------------------
    function App() {
      const [apiKey, setApiKey] = useState(() => localStorage.getItem(KEY_STORE) || "");
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [profile, setProfile] = useState(null);
      const [jobs, setJobs] = useState([]);
      const [status, setStatus] = useState({ text: "", type: "" });
      const [isPipelineRunning, setIsPipelineRunning] = useState(false);
      const [isUploading, setIsUploading] = useState(false);
      const [expandedJobId, setExpandedJobId] = useState(null);

      // Filters & Sorting state
      const [searchQuery, setSearchQuery] = useState("");
      const [sortOption, setSortOption] = useState("score");
      const [companyFilter, setCompanyFilter] = useState("");
      const [minScoreThreshold, setMinScoreThreshold] = useState(0);

      const pollRef = useRef(null);

      // Load data helper
      const loadData = useCallback(async (currentKey = apiKey) => {
        try {
          const [jobsRes, profileRes] = await Promise.all([
            apiFetch("/jobs", currentKey),
            apiFetch("/profile", currentKey),
          ]);

          if (jobsRes.ok) {
            const data = await jobsRes.json();
            setJobs(data.jobs || []);
          }
          if (profileRes.ok) {
            const data = await profileRes.json();
            setProfile(data.profile || null);
          }
        } catch (err) {
          setStatus({ text: "Could not reach backend API", type: "err" });
        }
      }, [apiKey]);

      // Polling function for pipeline status
      const startPolling = useCallback(() => {
        if (pollRef.current) return;
        setIsPipelineRunning(true);
        pollRef.current = setInterval(async () => {
          try {
            const res = await apiFetch("/pipeline/status", apiKey);
            if (!res.ok) return;
            const data = await res.json();
            if (data.running) {
              setIsPipelineRunning(true);
            } else {
              setIsPipelineRunning(false);
              clearInterval(pollRef.current);
              pollRef.current = null;
              await loadData();
              setStatus({
                text: data.last_error
                  ? `Pipeline error: ${data.last_error}`
                  : `Last run: ${data.last_run_at || "just now"}`,
                type: data.last_error ? "err" : "ok",
              });
            }
          } catch (e) {
            // silent network retry
          }
        }, 3000);
      }, [apiKey, loadData]);

      useEffect(() => {
        return () => {
          if (pollRef.current) clearInterval(pollRef.current);
        };
      }, []);

      useEffect(() => {
        loadData();
      }, [loadData]);

      // Handle saving API key
      const handleSaveKey = (newKey) => {
        localStorage.setItem(KEY_STORE, newKey);
        setApiKey(newKey);
        setIsModalOpen(false);
        loadData(newKey);
      };

      // Upload Handler
      const handleUpload = async (file) => {
        setIsUploading(true);
        setStatus({ text: "Uploading & starting pipeline…", type: "running" });

        const formData = new FormData();
        formData.append("file", file, "resume.pdf");

        try {
          const res = await apiFetch("/resume/upload", apiKey, {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          if (!res.ok) {
            setStatus({ text: `Upload failed: ${data.detail || res.status}`, type: "err" });
          } else {
            setStatus({ text: "Pipeline started in background…", type: "running" });
            startPolling();
          }
        } catch (e) {
          setStatus({ text: "Upload request failed", type: "err" });
        } finally {
          setIsUploading(false);
        }
      };

      // Run Pipeline Trigger Handler
      const handleRunCurrent = async () => {
        setStatus({ text: "Starting pipeline…", type: "running" });
        try {
          const res = await apiFetch("/pipeline/run", apiKey, { method: "POST" });
          const data = await res.json();
          if (!res.ok) {
            setStatus({ text: `Run failed: ${data.detail || res.status}`, type: "err" });
          } else {
            setStatus({ text: "Pipeline running in background…", type: "running" });
            startPolling();
          }
        } catch (e) {
          setStatus({ text: "Could not reach backend", type: "err" });
        }
      };

      // Update Job Saved/Dismissed Status
      const handleUpdateJobStatus = async (jobId, newStatus) => {
        try {
          const res = await apiFetch(`/jobs/${encodeURIComponent(jobId)}/status`, apiKey, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: newStatus }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            setStatus({ text: `Status update failed: ${err.detail || res.status}`, type: "err" });
            return;
          }
          // Optimistic local update
          setJobs((prevJobs) =>
            prevJobs.map((j) => (j.id === jobId ? { ...j, saved_status: newStatus } : j))
          );
        } catch (e) {
          setStatus({ text: "Could not update status", type: "err" });
        }
      };

      // Unique companies list for filtering
      const companyList = useMemo(() => {
        const set = new Set();
        jobs.forEach((j) => {
          if (j.company && j.company.trim()) set.add(j.company.trim());
        });
        return Array.from(set).sort();
      }, [jobs]);

      // Filtered & Sorted Jobs
      const visibleJobs = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        let list = jobs.filter((j) => {
          if (companyFilter && (j.company || "") !== companyFilter) return false;
          if ((j.match_score || 0) < minScoreThreshold) return false;
          if (!q) return true;
          const hay = [
            j.title || "",
            j.company || "",
            (j.matched_skills || []).join(" "),
            (j.description || "").slice(0, 1000),
          ]
            .join(" ")
            .toLowerCase();
          return hay.includes(q);
        });

        if (sortOption === "title") {
          list.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
        } else if (sortOption === "company") {
          list.sort((a, b) => (a.company || "").localeCompare(b.company || ""));
        } else {
          list.sort((a, b) => (b.match_score || 0) - (a.match_score || 0));
        }
        return list;
      }, [jobs, searchQuery, companyFilter, minScoreThreshold, sortOption]);

      return (
        <div className="container">
          <Header
            pipelineRunning={isPipelineRunning}
            statusText={status.text}
            statusType={status.type}
            onOpenKeyModal={() => setIsModalOpen(true)}
          />

          <ApiKeyModal
            isOpen={isModalOpen}
            initialKey={apiKey}
            onSave={handleSaveKey}
            onClose={() => setIsModalOpen(false)}
          />

          <UploadSection
            onUpload={handleUpload}
            onRunCurrent={handleRunCurrent}
            isUploading={isUploading}
            isPipelineRunning={isPipelineRunning}
          />

          <CandidateProfile profile={profile} />

          <div className="card">
            <h2>Matched Jobs</h2>

            <div className="threshold-row">
              <label htmlFor="thresholdSlider">Min score:</label>
              <input
                type="range"
                id="thresholdSlider"
                className="slider"
                min="0"
                max="100"
                step="5"
                value={minScoreThreshold}
                onChange={(e) => setMinScoreThreshold(parseInt(e.target.value, 10))}
              />
              <span className="slider-val">{minScoreThreshold}%</span>
              <span className="results-count">
                Showing {visibleJobs.length} of {jobs.length} jobs
              </span>
            </div>

            <div className="filters">
              <input
                type="text"
                value={searchQuery}
                placeholder="Search title / company / skills / description…"
                onChange={(e) => setSearchQuery(e.target.value)}
              />
              <div className="filter-group">
                <label>Sort by</label>
                <select value={sortOption} onChange={(e) => setSortOption(e.target.value)}>
                  <option value="score">Match score (high → low)</option>
                  <option value="title">Title (A–Z)</option>
                  <option value="company">Company (A–Z)</option>
                </select>
              </div>
              <div className="filter-group">
                <label>Company</label>
                <select
                  value={companyFilter}
                  onChange={(e) => setCompanyFilter(e.target.value)}
                >
                  <option value="">All Companies</option>
                  {companyList.map((c) => (
                    <option key={c} value={c}>
                      {c}
                    </option>
                  ))}
                </select>
              </div>
            </div>

            {jobs.length === 0 ? (
              <p className="empty">No results yet. Upload a resume or run the pipeline.</p>
            ) : visibleJobs.length === 0 ? (
              <p className="empty">No jobs match your current filters or score threshold.</p>
            ) : (
              visibleJobs.map((job) => (
                <JobCard
                  key={job.id}
                  job={job}
                  isExpanded={expandedJobId === job.id}
                  onToggleExpand={() =>
                    setExpandedJobId((prev) => (prev === job.id ? null : job.id))
                  }
                  onUpdateStatus={handleUpdateJobStatus}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    // Render the React 18 Application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
